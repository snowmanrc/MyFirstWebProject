<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task 03 - Hotel Reservation Form</title>
    <style>
        body {
            background-color: #e0e0e0;
            font-family: Arial, sans-serif;
        }
        .form-title {
            color: red;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
        }
        table {
            background-color: #d0e7ff;
            border-collapse: collapse;
            margin: 0 auto;
            border: 2px solid #555;
        }
        td {
            border: 1px solid #777;
            padding: 6px 10px;
        }
        .label-col {
            text-align: right;
            font-weight: bold;
            width: 130px;
        }
        input[type="text"] {
            width: 95%;
        }
        .submit-cell {
            text-align: center;
            background-color: #d0e7ff;
        }
    </style>
</head>
<body>

    <div class="form-title">Continental Hotel Reservation Form</div>

    <form action="#" method="post">
        <table>
            <tr>
                <td class="label-col">Name</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td class="label-col">eMail</td>
                <td><input type="text" value="info@continental.pk"></td>
            </tr>
            <tr>
                <td class="label-col">Mobile No</td>
                <td><input type="text" placeholder="Enter your cell number"></td>
            </tr>
            <tr>
                <td class="label-col">Arrival Time</td>
                <td><input type="text" placeholder="Enter your arrival time"></td>
            </tr>
            <tr>
                <td class="label-col">Departure</td>
                <td>
                    <input type="text" style="width: 45%;">
                    <input type="text" style="width: 45%;">
                </td>
            </tr>
            <tr>
                <td class="label-col">Room Type</td>
                <td>
                    <input type="radio" name="room" id="single"> <label for="single">Single</label>
                    <input type="radio" name="room" id="double"> <label for="double">Double</label><br>
                    <input type="radio" name="room" id="presidential"> <label for="presidential">Presidential Suite</label>
                </td>
            </tr>
            <tr>
                <td class="label-col">Preferences</td>
                <td>
                    <input type="checkbox" id="non-smoking"> <label for="non-smoking">Non-Smoking</label><br>
                    <input type="checkbox" id="internet"> <label for="internet">Internet</label><br>
                    <input type="checkbox" id="firm-mattress"> <label for="firm-mattress">Firm Mattress</label>
                </td>
            </tr>
            <tr>
                <td class="label-col">Mode of Payment</td>
                <td>
                    <input type="checkbox" id="cash"> <label for="cash">Cash</label>
                    <input type="checkbox" id="check"> <label for="check">Check</label><br>
                    <input type="checkbox" id="credit"> <label for="credit">Credit Card</label>
                    <select>
                        <option>Select Card</option>
                        <option>Visa</option>
                        <option>MasterCard</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="submit-cell">
                    <input type="submit" value="Send Data">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
